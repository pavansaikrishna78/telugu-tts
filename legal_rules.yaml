  8: ఎయిట్
  9: నైన్
  10: టెన్
  11: ఎలెవన్
  12: ట్వెల్వ్
  13: థర్టీన్
  14: ఫోర్టీన్
  15: ఫిఫ్టీన్
  16: సిక్స్టీన్
  17: సెవెంటీన్
  18: ఎయిటీన్
  19: నైన్టీన్
  20: ట్వంటీ
  30: థర్టీ
  40: ఫార్టీ
  50: ఫిఫ్టీ
  60: సిక్స్టీ
  70: సెవెంటీ
  80: ఎయిటీ
  90: నైంటీ
hundred: హండ్రెడ్
thousand: థౌజండ్
