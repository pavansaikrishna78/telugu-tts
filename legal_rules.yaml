# Spoken form of legal references. Edit freely; textprep.py reads this on every run.
#
#   Section 2(77)   -> సెక్షన్ టూ, సెవెంటీ సెవెన్
#   2(11)(a)(i)     -> టూ, ఎలెవన్, క్లాజ్ ఏ, సబ్ క్లాజ్ వన్
#   Section 115BAC  -> సెక్షన్ వన్ హండ్రెడ్ ఫిఫ్టీన్ బి ఏ సి

section_word: సెక్షన్
separator: ", "

labels:
  clause: క్లాజ్          # (a)
  sub_clause: సబ్ క్లాజ్   # (i), (iv)
  item: ఐటెమ్             # (A)

# How three-digit section numbers are read:
#   hundred : 202 -> టూ హండ్రెడ్ టూ       194 -> వన్ హండ్రెడ్ నైంటీ ఫోర్
#   pair    : 202 -> టూ ఓ టూ             194 -> వన్ నైంటీ ఫోర్
three_digit_style: hundred

# A single letter in the first lettered bracket is a clause letter, except these,
# which are read as roman numerals. So 2(24)(i) is "సబ్ క్లాజ్ వన్".
single_letters_read_as_roman: [i, v, x]

